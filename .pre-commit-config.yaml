# .beads/ is managed by the bd tool; don't enforce our style on its files
# (it rewrites metadata.json without a trailing newline and ships its own
# hook scripts, which fail our whitespace/shellcheck gates).
exclude: ^\.beads/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yaml]
        # .beads/ is managed by the bd tool; don't enforce our style on its docs.
        exclude: ^\.beads/

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
